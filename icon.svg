<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1c2420"/>
      <stop offset="100%" stop-color="#0b0e0c"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#2e3830" stroke-width="6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#8bc34a" stroke-width="3" stroke-dasharray="8 6"/>
  
  <!-- Tactical Crosshairs -->
  <line x1="256" y1="20" x2="256" y2="90" stroke="#8bc34a" stroke-width="4"/>
  <line x1="256" y1="422" x2="256" y2="492" stroke="#8bc34a" stroke-width="4"/>
  <line x1="20" y1="256" x2="90" y2="256" stroke="#8bc34a" stroke-width="4"/>
  <line x1="422" y1="256" x2="492" y2="256" stroke="#8bc34a" stroke-width="4"/>

  <!-- Compass Needle -->
  <polygon points="256,90 286,256 226,256" fill="#e53935"/>
  <polygon points="256,422 286,256 226,256" fill="#90a4ae"/>
  <circle cx="256" cy="256" r="28" fill="#1b1e1b" stroke="#8bc34a" stroke-width="5"/>
  <circle cx="256" cy="256" r="8" fill="#8bc34a"/>

  <!-- Compass Headings -->
  <text x="256" y="70" text-anchor="middle" fill="#e53935" font-family="monospace, sans-serif" font-weight="900" font-size="32">N</text>
  <text x="256" y="470" text-anchor="middle" fill="#90a4ae" font-family="monospace, sans-serif" font-weight="900" font-size="28">S</text>
  <text x="455" y="266" text-anchor="middle" fill="#90a4ae" font-family="monospace, sans-serif" font-weight="900" font-size="28">E</text>
  <text x="55" y="266" text-anchor="middle" fill="#90a4ae" font-family="monospace, sans-serif" font-weight="900" font-size="28">W</text>
</svg>
